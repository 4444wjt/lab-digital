<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1180" height="900" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">现状流程：设备预约（全人工、无记录）</text>
  <text x="40" y="74" font-size="14" fill="#64748b">高校教学/科研实验室 · 设备预约一条主路径 · 红色为流程断点</text>

  <!-- 泳道标签 -->
  <g font-size="13" font-weight="600" fill="#475569">
    <rect x="40" y="100" width="86" height="250" fill="#f1f5f9" rx="6"/>
    <text x="83" y="220" text-anchor="middle">学 生</text>
    <rect x="40" y="370" width="86" height="330" fill="#e2e8f0" rx="6"/>
    <text x="83" y="530" text-anchor="middle">管 理 员</text>
    <rect x="40" y="720" width="86" height="140" fill="#fee2e2" rx="6"/>
    <text x="83" y="790" text-anchor="middle" fill="#b91c1c">结 果</text>
  </g>

  <!-- 学生：微信问 -->
  <rect x="160" y="130" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="260" y="158" text-anchor="middle" font-size="15" fill="#0f172a">微信问「明天下午空不空」</text>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#94a3b8">口头、无凭证</text>

  <line x1="360" y1="160" x2="420" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 管理员：查台账 -->
  <rect x="420" y="400" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="428" text-anchor="middle" font-size="15" fill="#0f172a">翻纸质台账 / 凭记忆</text>
  <text x="520" y="448" text-anchor="middle" font-size="12" fill="#94a3b8">台账常滞后、常漏记</text>

  <!-- 学生 → 管理员 的折线 -->
  <path d="M360,160 C400,160 400,430 420,430" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 决策：有空吗 -->
  <path d="M520,470 L620,515 L520,560 L420,515 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="520" y="512" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">有空档吗？</text>
  <text x="520" y="530" text-anchor="middle" font-size="11" fill="#b45309">靠记忆判断</text>
  <line x1="520" y1="460" x2="520" y2="470" stroke="#64748b" stroke-width="1.5"/>

  <!-- 否：口头改期 -->
  <path d="M620,515 L700,515" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="640" y="508" font-size="12" fill="#dc2626">否</text>
  <rect x="700" y="485" width="180" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="790" y="510" text-anchor="middle" font-size="14" fill="#b91c1c">口头改期</text>
  <text x="790" y="528" text-anchor="middle" font-size="11" fill="#dc2626">再问一次，回到起点</text>
  <path d="M790,485 C790,300 260,300 260,190" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <!-- 是 -->
  <line x1="520" y1="560" x2="520" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="528" y="585" font-size="12" fill="#16a34a">是</text>

  <!-- 学生：到场使用 -->
  <rect x="420" y="250" width="200" height="0" fill="none"/>
  <rect x="420" y="620" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="648" text-anchor="middle" font-size="15" fill="#0f172a">到场使用</text>
  <text x="520" y="668" text-anchor="middle" font-size="12" fill="#94a3b8">此时才发现设备被占 / 已坏</text>

  <!-- 结果：白跑 -->
  <rect x="160" y="745" width="230" height="72" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="275" y="772" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">⚠ 白跑一趟</text>
  <text x="275" y="792" text-anchor="middle" font-size="11.5" fill="#dc2626">40–60 分钟 / 次 · 每学期约 60–80 次</text>

  <path d="M420,660 C380,700 340,720 300,745" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 正常使用完 -->
  <rect x="470" y="745" width="230" height="72" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="585" y="772" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">使用完成</text>
  <text x="585" y="792" text-anchor="middle" font-size="11.5" fill="#16a34a">无任何系统记录</text>

  <path d="M560,680 C570,710 578,730 583,745" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 管理员补记 -->
  <rect x="760" y="745" width="230" height="72" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="875" y="772" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">事后补记台账</text>
  <text x="875" y="792" text-anchor="middle" font-size="11.5" fill="#b45309">经常漏记 · 事后想不起来</text>

  <path d="M700,781 L760,781" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 底部结论 -->
  <rect x="160" y="840" width="830" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="575" y="867" text-anchor="middle" font-size="13" fill="#475569">
    结果：没有任何可用于统计的数据 —— 设备利用率说不清，冲突次数无法证明
  </text>

  <!-- 右侧注释 -->
  <text x="1010" y="430" font-size="12" font-weight="600" fill="#dc2626">流程断点</text>
  <text x="1010" y="452" font-size="11.5" fill="#64748b">① 预约靠口头</text>
  <text x="1010" y="472" font-size="11.5" fill="#64748b">② 冲突靠到场发现</text>
  <text x="1010" y="492" font-size="11.5" fill="#64748b">③ 记录靠事后补</text>
  <text x="1010" y="512" font-size="11.5" fill="#64748b">④ 数据不存在</text>
</svg>
