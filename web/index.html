<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室设备预约</title>
<style>
  /* ================= 设计令牌 ================= */
  :root{
    --bg:#080b10;
    --bg-soft:#0c1118;
    --panel:#0f141b;
    --panel-hi:#141b24;
    --line:#1e2630;
    --line-hi:#2a3542;
    --fg:#e6edf3;
    --fg-mid:#9aa7b4;
    --fg-dim:#6b7887;
    --accent:#58a6ff;
    --accent-dim:rgba(88,166,255,.14);
    --ok:#3fb950;
    --ok-dim:rgba(63,185,80,.13);
    --warn:#d29922;
    --warn-dim:rgba(210,153,34,.13);
    --danger:#f85149;
    --danger-dim:rgba(248,81,73,.13);
    --r-sm:8px; --r-md:12px; --r-lg:18px;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-soft:cubic-bezier(.33,1,.68,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--fg); font-size:14px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}

  /* ================= 环境光（ambient） ================= */
  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .ambient::before,.ambient::after{
    content:"";position:absolute;border-radius:50%;filter:blur(120px);opacity:.5;
  }
  .ambient::before{
    width:640px;height:640px;left:-180px;top:-260px;
    background:radial-gradient(circle,rgba(88,166,255,.20),transparent 68%);
    animation:drift1 26s var(--ease-soft) infinite alternate;
  }
  .ambient::after{
    width:720px;height:720px;right:-260px;top:180px;
    background:radial-gradient(circle,rgba(63,185,80,.13),transparent 70%);
    animation:drift2 32s var(--ease-soft) infinite alternate;
  }
  @keyframes drift1{to{transform:translate(120px,90px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-140px,-70px) scale(1.1)}}

  /* 细网格（grain） */
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.028;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 78%);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
  /* ?noanim=1 时同样让所有动画瞬间到最终态（截图用） */
  body.noanim *,body.noanim *::before,body.noanim *::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }

  /* ================= 悬浮玻璃胶囊导航 ================= */
  .navwrap{position:sticky;top:0;z-index:40;padding:14px 24px 0;display:flex;justify-content:center}
  .nav{
    width:100%;max-width:1420px;height:54px;display:flex;align-items:center;gap:14px;
    padding:0 10px 0 20px;border-radius:999px;
    background:rgba(15,20,27,.72);backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 40px rgba(0,0,0,.5);
  }
  .logo{
    width:26px;height:26px;border-radius:8px;flex:0 0 26px;
    background:linear-gradient(135deg,#58a6ff,#3fb950);
    box-shadow:0 0 18px rgba(88,166,255,.5);
  }
  .nav .brand{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
  .nav .sep{width:1px;height:18px;background:rgba(255,255,255,.09)}
  .nav .meta{font-size:12px;color:var(--fg-dim)}
  .nav .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;
    font-size:12.5px;font-weight:550;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03);color:var(--fg-mid);
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);
             box-shadow:0 0 0 0 rgba(63,185,80,.55);animation:beat 2.2s var(--ease-soft) infinite}
  .pill.off .dot{background:var(--danger);animation:none}
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}55%{box-shadow:0 0 0 6px rgba(63,185,80,0)}}

  /* 视图切换 tab */
  .tabs{display:flex;gap:2px;padding:3px;border-radius:999px;
        background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
  .tab{height:26px;padding:0 15px;border-radius:999px;font-size:12.5px;font-weight:550;
       cursor:pointer;border:none;background:transparent;color:var(--fg-mid);
       transition:background .2s,color .2s}
  .tab:hover{color:var(--fg)}
  .tab.on{background:rgba(255,255,255,.1);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}

  /* ================= Hero（2 行铁律） ================= */
  .hero{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:104px 24px 72px;text-align:center}
  .hero h1{
    font-size:clamp(2.6rem,4.4vw,4.1rem);line-height:1.15;font-weight:750;letter-spacing:-.035em;
    max-width:1180px;margin:0 auto;
  }
  .hero h1 .grad{
    background:linear-gradient(96deg,#58a6ff 0%,#3fb950 52%,#d29922 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{
    margin:18px auto 0;max-width:720px;font-size:15.5px;line-height:1.7;color:var(--fg-mid);
  }
  .hero .cta{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  .btn-hero{
    height:44px;padding:0 26px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid transparent;transition:transform .28s var(--ease-out),box-shadow .28s var(--ease-out),background .2s;
  }
  .btn-hero.solid{background:#e6edf3;color:#080b10;box-shadow:0 8px 24px rgba(230,237,243,.16)}
  .btn-hero.solid:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 34px rgba(230,237,243,.24)}
  .btn-hero.ghost{background:rgba(255,255,255,.04);color:var(--fg);border-color:rgba(255,255,255,.12)}
  .btn-hero.ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)}

  /* ================= 主体 ================= */
  main{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:32px 24px 112px;
       display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px}
  @media (max-width:1080px){main{grid-template-columns:1fr}}

  .panel{
    background:linear-gradient(180deg,rgba(20,27,36,.92),rgba(15,20,27,.92));
    border:1px solid var(--line);border-radius:var(--r-lg);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    overflow:hidden;position:relative;
  }
  .panel + .panel{margin-top:20px}
  .panel::before{
    content:"";position:absolute;inset:0 0 auto;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  }
  .phead{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
         font-size:13px;font-weight:640;letter-spacing:.01em}
  .phead .n{margin-left:auto;font-weight:400;font-size:12px;color:var(--fg-dim)}
  .pbody{padding:20px}

  /* ================= 设备卡（hover 物理） ================= */
  .devgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.devgrid{grid-template-columns:1fr}}
  .dev{
    position:relative;border:1px solid var(--line);border-radius:var(--r-md);
    padding:13px 15px;background:rgba(255,255,255,.018);cursor:pointer;overflow:hidden;
    transition:border-color .3s var(--ease-out),background .3s var(--ease-out),box-shadow .4s var(--ease-out);
    will-change:transform;
  }
  .dev::after{
    content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(88,166,255,.13),transparent 62%);
    opacity:0;transition:opacity .35s var(--ease-out);
  }
  .dev:hover{border-color:var(--line-hi);background:rgba(255,255,255,.035)}
  .dev:hover::after{opacity:1}
  .dev.sel{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 1px rgba(88,166,255,.35),0 8px 30px rgba(88,166,255,.12)}
  .dev .l1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .dev .nm{font-size:14px;font-weight:620;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
  .dev .mt{font-size:11.5px;color:var(--fg-dim);line-height:1.55}
  .sdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .sdot.idle{background:var(--ok);box-shadow:0 0 10px rgba(63,185,80,.7)}
  .sdot.busy{background:var(--warn);box-shadow:0 0 10px rgba(210,153,34,.7);animation:beat 1.9s var(--ease-soft) infinite}
  .sdot.maintenance{background:var(--fg-dim)}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
        font-size:11px;font-weight:600;letter-spacing:.01em}
  .chip.idle{background:var(--ok-dim);color:var(--ok)}
  .chip.busy{background:var(--warn-dim);color:var(--warn)}
  .chip.maintenance{background:rgba(107,120,135,.16);color:var(--fg-dim)}
  .chip.pending{background:var(--warn-dim);color:var(--warn)}
  .chip.approved{background:var(--ok-dim);color:var(--ok)}
  .chip.rejected{background:var(--danger-dim);color:var(--danger)}

  /* ================= 表单 ================= */
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:7px;color:var(--fg-mid);letter-spacing:.01em}
  .field .h{font-weight:400;color:var(--fg-dim);font-size:11.5px;margin-left:8px}
  input,select{
    width:100%;height:40px;padding:0 13px;border-radius:var(--r-sm);
    border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--fg);
    outline:none;transition:border-color .22s var(--ease-out),box-shadow .22s var(--ease-out),background .22s;
  }
  input::placeholder{color:var(--fg-dim)}
  input:focus,select:focus{
    border-color:rgba(88,166,255,.55);background:rgba(0,0,0,.42);
    box-shadow:0 0 0 3px rgba(88,166,255,.13);
  }
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{
    height:40px;padding:0 20px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);
    transition:transform .24s var(--ease-out),background .2s,border-color .2s;
  }
  .btn:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:var(--line-hi);transform:translateY(-1px)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.99)}
  .btn.pri{
    background:linear-gradient(180deg,#6cb4ff,#3d8ee8);border-color:transparent;color:#06121f;
    box-shadow:0 8px 26px rgba(88,166,255,.26);
  }
  .btn.pri:hover:not(:disabled){box-shadow:0 12px 34px rgba(88,166,255,.34)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{height:28px;padding:0 12px;font-size:12px;border-radius:6px;font-weight:550}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(6,18,31,.3);
        border-top-color:#06121f;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ================= 提示 ================= */
  .nt{padding:13px 15px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px;border:1px solid var(--line);
      background:rgba(255,255,255,.03);line-height:1.6}
  .nt.ok{background:var(--ok-dim);border-color:rgba(63,185,80,.35);color:#7ee787}
  .nt.err{background:var(--danger-dim);border-color:rgba(248,81,73,.35);color:#ff9c96}
  .nt.warn{background:var(--warn-dim);border-color:rgba(210,153,34,.38);color:#f0c451}
  .nt b{font-weight:680}
  .slots{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .slots .lbl{font-size:12px;color:var(--fg-dim)}
  .slot{
    padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(210,153,34,.42);color:#f0c451;
    transition:transform .22s var(--ease-out),background .2s;
  }
  .slot:hover{transform:translateY(-2px);background:rgba(210,153,34,.16)}

  /* ================= 预约列表 ================= */
  .res{border-bottom:1px solid var(--line);padding:13px 0;transition:background .25s}
  .res:last-child{border-bottom:none}
  .res:hover{background:rgba(255,255,255,.018)}
  .res .l1{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .res .who{font-weight:640;letter-spacing:-.01em}
  .res .dn{color:var(--fg-dim);font-size:12px}
  .res .tm{margin-left:auto;font-size:12px;color:var(--fg-mid);font-variant-numeric:tabular-nums}
  .res .l2{font-size:12px;color:var(--fg-dim);margin-top:5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .acts{margin-left:auto;display:flex;gap:7px}

  /* ================= 统计 ================= */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{
    position:relative;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;
    background:rgba(255,255,255,.022);overflow:hidden;
  }
  .kpi::after{
    content:"";position:absolute;right:-30px;top:-30px;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,rgba(88,166,255,.18),transparent 70%);
  }
  .kpi .v{font-size:26px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .k{font-size:11.5px;color:var(--fg-dim);margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;color:var(--fg-dim);font-weight:600;letter-spacing:.03em}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-mid)}
  .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#58a6ff,#3fb950);
         transform-origin:left;animation:grow .8s var(--ease-out) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* ================= 骨架屏 / 空状态 ================= */
  .sk{height:62px;border-radius:var(--r-md);margin-bottom:12px;
      background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%);
      background-size:200% 100%;animation:shim 1.5s linear infinite}
  @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
  .empty{color:var(--fg-dim);font-size:13px;text-align:center;padding:30px 20px}

  /* ================= Toast ================= */
  .toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{
    min-width:230px;padding:12px 18px;border-radius:var(--r-md);font-size:13px;font-weight:550;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.55);
  }
  .toast.ok{background:rgba(63,185,80,.16);color:#7ee787;border-color:rgba(63,185,80,.34)}
  .toast.err{background:rgba(248,81,73,.16);color:#ff9c96;border-color:rgba(248,81,73,.34)}

  /* ================= 统计视图 ================= */
  .svpage{max-width:1420px;margin:0 auto;padding:48px 24px 112px}
  .sv-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:36px}
  .sv-head h2{font-size:clamp(1.8rem,2.6vw,2.5rem);font-weight:720;letter-spacing:-.03em;line-height:1.2}
  .sv-head p{margin-top:10px;font-size:14px;color:var(--fg-mid);max-width:640px;line-height:1.65}
  .sv-head .btn{margin-left:auto;flex:0 0 auto}

  .sv-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  @media (max-width:900px){.sv-kpis{grid-template-columns:repeat(2,1fr)}}
  .sv-kpi{
    position:relative;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;
    background:linear-gradient(180deg,rgba(20,27,36,.9),rgba(15,20,27,.9));overflow:hidden;
  }
  .sv-kpi::after{
    content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle,rgba(88,166,255,.16),transparent 70%);
  }
  .sv-kpi.warn::after{background:radial-gradient(circle,rgba(210,153,34,.2),transparent 70%)}
  .sv-kpi .v{font-size:34px;font-weight:760;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
  .sv-kpi .v .u{font-size:16px;font-weight:600;color:var(--fg-mid);margin-left:3px;letter-spacing:0}
  .sv-kpi .k{font-size:12.5px;font-weight:600;color:var(--fg-mid);margin-top:6px}
  .sv-kpi .d{font-size:11.5px;color:var(--fg-dim);margin-top:8px;line-height:1.55;position:relative;z-index:1}

  .sv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  @media (max-width:900px){.sv-grid{grid-template-columns:1fr}}
  .sv-grid .panel{background:linear-gradient(180deg,rgba(20,27,36,.92),rgba(15,20,27,.92));
                  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .sv-grid .panel + .panel{margin-top:0}

  /* 环形利用率 */
  .ringwrap{display:flex;flex-direction:column;align-items:center;padding:12px 0 4px}
  .ring{width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .ringhole{
    width:126px;height:126px;border-radius:50%;background:#0c1118;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .ringval{font-size:30px;font-weight:760;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .ringval span{font-size:15px;font-weight:600;color:var(--fg-mid);margin-left:1px}
  .ringsub{font-size:11px;color:var(--fg-dim)}
  .ringlabel{margin-top:14px;font-size:12px;color:var(--fg-mid)}

  /* 状态分布 */
  .distrow{margin-bottom:16px}
  .distrow:last-child{margin-bottom:0}
  .dl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
  .dl .dn2{color:var(--fg-dim);font-variant-numeric:tabular-nums}
  .dbar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .dbar i{display:block;height:100%;border-radius:3px;animation:grow .8s var(--ease-out) both}
  .dbar i.warn{background:linear-gradient(90deg,#d29922,#e0b44a)}
  .dbar i.ok{background:linear-gradient(90deg,#3fb950,#56d364)}
  .dbar i.danger{background:linear-gradient(90deg,#f85149,#ff7b72)}

  /* 时段柱状 */
  .hours{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
  .hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
  .hnum{font-size:10px;color:var(--fg-dim);font-variant-numeric:tabular-nums;height:12px}
  .hbar{width:100%;border-radius:3px 3px 0 0;min-height:4px;transition:height .5s var(--ease-out)}
  .hlbl{font-size:9.5px;color:var(--fg-dim);margin-top:2px}

  /* 冲突留痕 */
  .cfrow{border-bottom:1px solid var(--line);padding:10px 0}
  .cfrow:last-child{border-bottom:none}
  .cfl1{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .cfdev{font-weight:620}
  .cftime{margin-left:auto;font-size:11px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
  .cfl2{font-size:11.5px;color:var(--fg-dim);margin-top:4px;line-height:1.5}

  /* 待审批 */
  .pdrow{border-bottom:1px solid var(--line);padding:11px 0}
  .pdrow:last-child{border-bottom:none}
  .pdl1{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .pdl1 .who{font-weight:620}
  .pdl1 .dn{color:var(--fg-dim);font-size:11.5px;margin-left:auto}
  .pdl2{font-size:11.5px;color:var(--fg-dim);margin-top:3px;line-height:1.5}

  /* 抖动（冲突） */
  @keyframes shake{0%,100%{transform:translateX(0)}18%,54%,86%{transform:translateX(-5px)}36%,72%{transform:translateX(5px)}}
  .nt.warn.shake{animation:shake .5s var(--ease-soft)}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="grain"></div>
<div id="root"></div>
<div class="toasts" id="toasts"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/htm.umd.js"></script>
<script src="./vendor/gsap.min.js"></script>
<script>
const { useState, useEffect, useCallback, useRef } = React;
const html = htm.bind(React.createElement);
const API = "";
/* ?noanim=1 跳过入场动画（用于截图/无动画环境验证布局） */
const NOANIM = (() => {
  try { return new URLSearchParams(location.search).get("noanim") === "1"; }
  catch (e) { return false; }
})();
if (NOANIM) document.body.classList.add("noanim");
const pad = n => String(n).padStart(2, "0");
const fmtDT = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hhmm = s => (s || "").slice(11, 16);

async function api(path, opt){
  const r = await fetch(API + path, opt);
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
}

/* ---------- Toast ---------- */
function useToasts(){
  const [list, setList] = useState([]);
  const push = useCallback((msg, kind = "ok") => {
    const id = Date.now() + Math.random();
    setList(v => [...v, { id, msg, kind }]);
    setTimeout(() => setList(v => v.filter(x => x.id !== id)), 3400);
  }, []);
  return [list, push];
}
function Toasts({ list }){
  const ref = useRef(null);
  useEffect(() => {
    const nodes = ref.current ? [...ref.current.children] : [];
    nodes.forEach(n => {
      gsap.fromTo(n, { x: 40, opacity: 0, scale: .96 },
        { x: 0, opacity: 1, scale: 1, duration: .55, ease: "back.out(1.7)" });
    });
  }, [list.length]);
  return html`<div ref=${ref} style=${{ display: "contents" }}>
    ${list.map(t => html`<div key=${t.id} class=${"toast " + t.kind}>${t.msg}</div>`)}
  </div>`;
}

/* ---------- 数字滚动（GSAP） ---------- */
function CountUp({ value, decimals = 0 }){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obj = { v: parseFloat(el.textContent) || 0 };
    const tw = gsap.to(obj, {
      v: Number(value) || 0, duration: 1.05, ease: "power2.out",
      onUpdate: () => { el.textContent = obj.v.toFixed(decimals); },
    });
    return () => tw.kill();
  }, [value, decimals]);
  return html`<span ref=${ref}>${(Number(value) || 0).toFixed(decimals)}</span>`;
}

/* ---------- 设备卡（鼠标光斑 + hover 物理） ---------- */
function DeviceCard({ d, sel, onPick }){
  const ref = useRef(null);
  const statusText = { idle: "空闲", busy: "使用中", maintenance: "维护中" }[d.runtime_status];

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const move = e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", `${e.clientX - r.left}px`);
      el.style.setProperty("--my", `${e.clientY - r.top}px`);
    };
    const enter = () => gsap.to(el, { y: -3, duration: .35, ease: "power2.out" });
    const leave = () => gsap.to(el, { y: 0, duration: .45, ease: "power2.out" });
    el.addEventListener("mousemove", move);
    el.addEventListener("mouseenter", enter);
    el.addEventListener("mouseleave", leave);
    return () => {
      el.removeEventListener("mousemove", move);
      el.removeEventListener("mouseenter", enter);
      el.removeEventListener("mouseleave", leave);
    };
  }, []);

  return html`<div ref=${ref} class=${"dev" + (sel ? " sel" : "")} onClick=${() => onPick(d.id)}>
    <div class="l1">
      <span class=${"sdot " + d.runtime_status}></span>
      <span class="nm" title=${d.name}>${d.name}</span>
    </div>
    <div class="mt">${d.model}</div>
    <div class="mt">${d.location}</div>
    <div style=${{ marginTop: "9px", display: "flex", alignItems: "center", gap: "8px" }}>
      <span class=${"chip " + d.runtime_status}>${statusText}</span>
      ${d.next_booking ? html`<span class="mt" style=${{ fontSize: "11px" }}>
        ${hhmm(d.next_booking.start)}–${hhmm(d.next_booking.end)} 已被占
      </span>` : null}
    </div>
  </div>`;
}

/* ---------- 预约行 ---------- */
function ResRow({ r, onAct }){
  const tagText = { pending: "待审批", approved: "已通过", rejected: "已驳回" }[r.status] || r.status;
  return html`<div class="res">
    <div class="l1">
      <span class="who">${r.user}</span>
      <span class="dn">${r.device_name || r.device_id}</span>
      <span class="tm">${r.start.replace("T", " ")} → ${hhmm(r.end)}</span>
    </div>
    <div class="l2">
      <span class=${"chip " + r.status}>${tagText}</span>
      <span>${r.purpose}</span>
      ${r.reject_reason ? html`<span style=${{ color: "var(--danger)" }}>· ${r.reject_reason}</span>` : null}
      ${r.status === "pending" ? html`<span class="acts">
        <button class="btn sm" onClick=${() => onAct("approve", r.id)}>通过</button>
        <button class="btn sm" onClick=${() => onAct("reject", r.id)}>驳回</button>
      </span>` : null}
    </div>
  </div>`;
}

/* ---------- 统计表 ---------- */
function StatsTable({ rows }){
  const max = Math.max(1, ...rows.map(r => r.hours));
  return html`<table>
    <thead><tr><th>设备</th><th class="num">机时</th><th class="num">次数</th></tr></thead>
    <tbody>
      ${rows.map(r => html`<tr key=${r.id}>
        <td>
          <div>${r.name}</div>
          <div class="bar"><i style=${{ width: `${(r.hours / max) * 100}%` }}></i></div>
        </td>
        <td class="num">${r.hours}</td>
        <td class="num">${r.sessions}</td>
      </tr>`)}
    </tbody>
  </table>`;
}

/* ================= 统计视图（独立页面） ================= */
function Ring({ pct, label, sub }){
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  return html`<div class="ringwrap">
    <div class="ring" style=${{ background: `conic-gradient(#58a6ff ${p * 3.6}deg, rgba(255,255,255,.06) 0)` }}>
      <div class="ringhole">
        <div class="ringval"><${CountUp} value=${p} decimals=${1} /><span>%</span></div>
        <div class="ringsub">${sub}</div>
      </div>
    </div>
    <div class="ringlabel">${label}</div>
  </div>`;
}

function StatsView({ stats, onBack }){
  const ref = useRef(null);

  useEffect(() => {
    if (NOANIM || !ref.current || !stats) return;
    const items = ref.current.querySelectorAll(".sv-anim");
    gsap.fromTo(items, { y: 26, opacity: 0 },
      { y: 0, opacity: 1, duration: .7, stagger: .06, ease: "power3.out" });
  }, [stats === null]);

  if (!stats) {
    return html`<div class="svpage">
      <div class="sk" style=${{ height: "120px" }}></div>
      <div class="sk" style=${{ height: "220px" }}></div>
    </div>`;
  }

  const hours = stats.by_hour || {};
  const maxHour = Math.max(1, ...Object.values(hours));
  const st = stats.by_status || {};
  const total = Math.max(1, (st.pending || 0) + (st.approved || 0) + (st.rejected || 0));

  return html`<div class="svpage" ref=${ref}>
    <div class="sv-head sv-anim">
      <div>
        <h2>统计看板</h2>
        <p>这些数字在现状里并不存在 —— 因为没有任何一条使用记录被留下。</p>
      </div>
      <button class="btn" onClick=${onBack}>返回预约</button>
    </div>

    <div class="sv-kpis sv-anim">
      <div class="sv-kpi">
        <div class="v"><${CountUp} value=${stats.device_count ?? 0} /></div>
        <div class="k">设备总数</div>
        <div class="d">其中 ${(stats.idle_devices || []).length} 台当前空闲</div>
      </div>
      <div class="sv-kpi">
        <div class="v"><${CountUp} value=${stats.reservation_total ?? 0} /></div>
        <div class="k">预约总数</div>
        <div class="d">已通过 ${stats.approved ?? 0} · 待审批 ${stats.pending ?? 0} · 驳回 ${stats.rejected ?? 0}</div>
      </div>
      <div class="sv-kpi">
        <div class="v"><${CountUp} value=${stats.total_hours ?? 0} decimals=${1} /><span class="u">h</span></div>
        <div class="k">累计机时</div>
        <div class="d">可用 ${stats.capacity_hours ?? 0} h / ${stats.covered_days ?? 0} 天</div>
      </div>
      <div class="sv-kpi warn">
        <div class="v"><${CountUp} value=${stats.conflict_count ?? 0} /></div>
        <div class="k">冲突次数</div>
        <div class="d">每次撞车都留了痕，不再是"说不清"</div>
      </div>
    </div>

    <div class="sv-grid">
      <div class="panel sv-anim">
        <div class="phead">设备利用率</div>
        <div class="pbody" style=${{ display: "flex", justifyContent: "center" }}>
          <${Ring} pct=${stats.utilization ?? 0} label="已有机时 / 可用机时"
                    sub=${`${stats.covered_days ?? 0} 天`} />
        </div>
      </div>

      <div class="panel sv-anim">
        <div class="phead">预约状态分布</div>
        <div class="pbody">
          ${[["pending", "待审批", "warn"], ["approved", "已通过", "ok"], ["rejected", "已驳回", "danger"]]
            .map(([k, label, cls]) => {
              const n = st[k] || 0;
              const pct = (n / total) * 100;
              return html`<div key=${k} class="distrow">
                <div class="dl"><span>${label}</span><span class="dn2">${n} 条</span></div>
                <div class="dbar"><i class=${cls} style=${{ width: `${pct}%` }}></i></div>
              </div>`;
            })}
        </div>
      </div>

      <div class="panel sv-anim" style=${{ gridColumn: "span 2" }}>
        <div class="phead">时段分布 <span class="n">按预约起始小时统计</span></div>
        <div class="pbody">
          <div class="hours">
            ${Object.entries(hours).map(([h, n]) => html`<div key=${h} class="hcol" title=${`${h}:00 — ${n} 次`}>
              <div class="hnum">${n || ""}</div>
              <div class="hbar" style=${{ height: `${Math.max(4, (n / maxHour) * 100)}%`,
                                        background: n ? "linear-gradient(180deg,#6cb4ff,#3d8ee8)" : "rgba(255,255,255,.06)" }}></div>
              <div class="hlbl">${h}</div>
            </div>`)}
          </div>
        </div>
      </div>

      <div class="panel sv-anim" style=${{ gridColumn: "span 2" }}>
        <div class="phead">设备机时排行 <span class="n">${stats.by_device?.length || 0} 台</span></div>
        <div class="pbody">
          ${stats.by_device?.length
            ? html`<${StatsTable} rows=${stats.by_device} />`
            : html`<div class="empty">暂无数据</div>`}
        </div>
      </div>

      <div class="panel sv-anim">
        <div class="phead">冲突留痕 <span class="n">最近 ${stats.recent_conflicts?.length || 0} 条</span></div>
        <div class="pbody">
          ${stats.recent_conflicts?.length
            ? stats.recent_conflicts.map((c, i) => html`<div key=${i} class="cfrow">
                <div class="cfl1"><span class="cfdev">${c.device_name || c.device_id}</span>
                  <span class="cftime">${(c.at || "").slice(5, 16).replace("T", " ")}</span></div>
                <div class="cfl2">${c.user} 想约 ${hhmm(c.start)}–${hhmm(c.end)}，与 ${c.conflict_with} 撞车</div>
              </div>`)
            : html`<div class="empty">还没有冲突记录<br/><span style=${{ fontSize: "11.5px" }}>
                试着约一个已被占的时段，这里就会出现
              </span></div>`}
        </div>
      </div>

      <div class="panel sv-anim">
        <div class="phead">待审批 <span class="n">${stats.pending_list?.length || 0} 条</span></div>
        <div class="pbody">
          ${stats.pending_list?.length
            ? stats.pending_list.map(r => html`<div key=${r.id} class="pdrow">
                <div class="pdl1"><span class="who">${r.user}</span>
                  <span class="dn">${r.device_name}</span></div>
                <div class="pdl2">${r.start.replace("T", " ")} → ${hhmm(r.end)}</div>
                <div class="pdl2">${r.purpose}</div>
              </div>`)
            : html`<div class="empty">没有待审批的预约</div>`}
        </div>
      </div>
    </div>
  </div>`;
}

/* ================= 主应用 ================= */
function App(){
  const [devices, setDevices] = useState(null);
  const [reservations, setReservations] = useState(null);
  const [stats, setStats] = useState(null);
  const [sel, setSel] = useState("D01");
  const [form, setForm] = useState(() => {
    const t = new Date(); t.setDate(t.getDate() + 1); t.setHours(9, 30, 0, 0);
    const e = new Date(t); e.setHours(e.getHours() + 1);
    return { device_id: "D01", start: fmtDT(t), end: fmtDT(e), user: "", purpose: "" };
  });
  const [notice, setNotice] = useState(null);
  const [busy, setBusy] = useState(false);
  const [online, setOnline] = useState(null);
  const [view, setView] = useState(() => {   // booking | stats
    try { return new URLSearchParams(location.search).get("view") === "stats" ? "stats" : "booking"; }
    catch (e) { return "booking"; }
  });
  const [toasts, toast] = useToasts();

  const heroRef = useRef(null);
  const navRef = useRef(null);
  const mainRef = useRef(null);

  /* GSAP 入场时间轴 */
  useEffect(() => {
    if (NOANIM) { gsap.set([navRef.current, heroRef.current, mainRef.current], { clearProps: "all" }); return; }
    const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
    tl.from(navRef.current, { y: -28, opacity: 0, duration: .7 })
      .from(heroRef.current?.querySelectorAll("h1, p, .cta") || [],
            { y: 34, opacity: 0, duration: .85, stagger: .11 }, "-=.35")
      .from(mainRef.current?.querySelectorAll(".panel") || [],
            { y: 46, opacity: 0, duration: .8, stagger: .1 }, "-=.5");
    return () => tl.kill();
  }, []);

  const loadAll = useCallback(async () => {
    const [a, b, c] = await Promise.all([
      api("/api/devices"), api("/api/reservations"), api("/api/stats"),
    ]);
    if (a.ok) setDevices(a.data.devices || []);
    if (b.ok) setReservations(b.data.reservations || []);
    if (c.ok) setStats(c.data);
  }, []);

  useEffect(() => {
    (async () => {
      try { setOnline((await api("/health")).ok); } catch { setOnline(false); }
      await loadAll();
    })();
  }, [loadAll]);

  /* 入场后设备卡依次浮现 */
  useEffect(() => {
    if (NOANIM || !devices) return;
    const cards = document.querySelectorAll(".dev");
    gsap.fromTo(cards, { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: .55, stagger: .045, ease: "power2.out", delay: .15 });
  }, [devices === null]);

  const pickDevice = useCallback(id => {
    setSel(id); setForm(f => ({ ...f, device_id: id }));
  }, []);

  const pickSlot = useCallback(s => {
    const d = new Date(s), e = new Date(d); e.setHours(e.getHours() + 2);
    setForm(f => ({ ...f, start: fmtDT(d), end: fmtDT(e) }));
    toast("已填入建议时段", "ok");
  }, [toast]);

  const submit = useCallback(async () => {
    setNotice(null);
    if (!form.start || !form.end) { setNotice({ kind: "err", text: "请选择开始与结束时间" }); return; }
    setBusy(true);
    try {
      const { ok, status, data } = await api("/api/reservations", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form),
      });
      if (ok) {
        setNotice({ kind: "ok", text: `已提交，等待管理员审批（单号 ${data.reservation.id}）` });
        toast("预约已提交", "ok");
        await loadAll();
      } else if (status === 409) {
        setNotice({ kind: "warn", shake: true, text: data.message, slots: data.suggested_slots || [] });
        toast("时段冲突，已给出可约时段", "err");
      } else {
        setNotice({ kind: "err", text: data.message || `提交失败（HTTP ${status}）` });
      }
    } finally { setBusy(false); }
  }, [form, loadAll, toast]);

  const onAct = useCallback(async (act, id) => {
    if (act === "approve") {
      const { ok, status, data } = await api(`/api/reservations/${id}/approve`, { method: "POST" });
      if (!ok) { setNotice({ kind: status === 409 ? "warn" : "err", text: data.message }); return; }
      toast("已通过", "ok");
    } else {
      const reason = prompt("驳回原因（可留空）") ?? "";
      const { ok, data } = await api(`/api/reservations/${id}/reject`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reason }),
      });
      if (!ok) { setNotice({ kind: "err", text: data.message }); return; }
      toast("已驳回", "ok");
    }
    await loadAll();
  }, [loadAll, toast]);

  return html`<${React.Fragment}>
    <div class="navwrap">
      <div class="nav" ref=${navRef}>
        <div class="logo"></div>
        <span class="brand">实验室设备预约</span>
        <span class="sep"></span>
        <span class="meta">高校教学 / 科研实验室</span>
        <div class="tabs">
          <button class=${"tab" + (view === "booking" ? " on" : "")} onClick=${() => setView("booking")}>预约</button>
          <button class=${"tab" + (view === "stats" ? " on" : "")} onClick=${() => setView("stats")}>统计</button>
        </div>
        <span class="spacer"></span>
        <span class=${"pill" + (online === false ? " off" : "")}>
          <span class="dot"></span>
          ${online === null ? "连接中" : online ? "服务在线" : "服务未连接"}
        </span>
      </div>
    </div>

    ${view === "stats"
      ? html`<${StatsView} stats=${stats} onBack=${() => setView("booking")} />`
      : html`
    <section class="hero" ref=${heroRef}>
      <h1>把设备预约从<span class="grad">微信口头</span><br/>变成可查、可验、可统计</h1>
      <p>提交前自动检测时段冲突，冲突时直接给出当天可约时间；每次使用自动留痕，利用率不再靠感觉估。</p>
      <div class="cta">
        <button class="btn-hero solid" onClick=${() => {
          setView("booking");
          setTimeout(() => document.querySelector(".panel")?.scrollIntoView({ block: "center", behavior: "smooth" }), 60);
        }}>开始预约</button>
        <button class="btn-hero ghost" onClick=${() => setView("stats")}>查看统计</button>
      </div>
    </section>

    <main ref=${mainRef}>
      <div>
        <div class="panel">
          <div class="phead">设备清单 <span class="n">${devices ? devices.length + " 台" : "…"}</span></div>
          <div class="pbody">
            ${devices === null
              ? html`<div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`
              : html`<div class="devgrid">
                  ${devices.map(d => html`<${DeviceCard} key=${d.id} d=${d} sel=${sel === d.id} onPick=${pickDevice} />`)}
                </div>`}
          </div>
        </div>

        <div class="panel">
          <div class="phead">提交预约</div>
          <div class="pbody">
            ${notice ? html`<div class=${"nt " + notice.kind + (notice.shake ? " shake" : "")}>
              ${notice.kind === "warn" ? html`<b>时段冲突</b> — ` : null}${notice.text}
              ${notice.slots && notice.slots.length ? html`<div class="slots">
                <span class="lbl">这一天还可约：</span>
                ${notice.slots.map(s => html`<span key=${s} class="slot" onClick=${() => pickSlot(s)}>${hhmm(s)} 起</span>`)}
              </div>` : null}
            </div>` : null}

            <div class="field">
              <label>设备<span class="h">点上方卡片可自动填入</span></label>
              <select value=${form.device_id} onChange=${e => pickDevice(e.target.value)}>
                ${(devices || []).map(d => html`<option key=${d.id} value=${d.id}>${d.id} · ${d.name}</option>`)}
              </select>
            </div>

            <div class="g2">
              <div class="field">
                <label>开始时间</label>
                <input type="datetime-local" value=${form.start}
                       onChange=${e => setForm(f => ({ ...f, start: e.target.value }))} />
              </div>
              <div class="field">
                <label>结束时间</label>
                <input type="datetime-local" value=${form.end}
                       onChange=${e => setForm(f => ({ ...f, end: e.target.value }))} />
              </div>
            </div>

            <div class="g2">
              <div class="field">
                <label>预约人</label>
                <input placeholder="姓名" value=${form.user}
                       onChange=${e => setForm(f => ({ ...f, user: e.target.value }))} />
              </div>
              <div class="field">
                <label>用途<span class="h">哪门课 / 哪个课题</span></label>
                <input placeholder="例：分析化学实验" value=${form.purpose}
                       onChange=${e => setForm(f => ({ ...f, purpose: e.target.value }))} />
              </div>
            </div>

            <button class="btn pri" disabled=${busy} onClick=${submit}>
              ${busy ? html`<span class="spin"></span>提交中…` : "提交预约"}
            </button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="phead">预约记录 <span class="n">${reservations ? reservations.length + " 条" : "…"}</span></div>
          <div class="pbody">
            ${reservations === null
              ? html`<div><div class="sk"></div><div class="sk"></div></div>`
              : reservations.length
                ? reservations.map(r => html`<${ResRow} key=${r.id} r=${r} onAct=${onAct} />`)
                : html`<div class="empty">还没有预约</div>`}
          </div>
        </div>

        <div class="panel">
          <div class="phead">统计看板 <span class="n">现状里没有的东西</span></div>
          <div class="pbody">
            <div class="kpis">
              <div class="kpi"><div class="v"><${CountUp} value=${stats?.device_count ?? 0} /></div><div class="k">设备总数</div></div>
              <div class="kpi"><div class="v"><${CountUp} value=${stats?.approved ?? 0} /></div><div class="k">已通过预约</div></div>
              <div class="kpi"><div class="v"><${CountUp} value=${stats?.total_hours ?? 0} decimals=${1} /></div><div class="k">累计机时 (h)</div></div>
              <div class="kpi"><div class="v"><${CountUp} value=${stats?.pending ?? 0} /></div><div class="k">待审批</div></div>
            </div>
            ${stats?.by_device?.length ? html`<${StatsTable} rows=${stats.by_device} />` : null}
          </div>
        </div>
      </div>
    </main>
    `}

    <${Toasts} list=${toasts} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
